<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cofki · Panel de reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Montserrat+Alternates:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --candy:#FF5252;
    --candy-dark:#E53935;
    --jungle:#00BFA5;
    --jungle-dark:#26A69A;
    --honey:#FFA726;
    --butter:#FFD180;
    --elephant:#424242;
    --seal:#757575;
    --light-gray:#E0E0E0;
    --paper:#F7F6F3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Montserrat',sans-serif;
    background:var(--paper);
    color:var(--elephant);
    min-height:100vh;
  }

  header{
    background:var(--elephant);
    color:#fff;
    padding:20px 24px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  header .mark{display:flex;align-items:center;gap:10px;}
  header .brandtitle{
    font-family:'Montserrat Alternates',sans-serif;
    font-weight:800;
    font-size:22px;
  }
  header .sub{
    font-size:12px;
    color:#c9c9c9;
    letter-spacing:.5px;
    text-transform:uppercase;
    font-weight:600;
  }

  main{
    max-width:1080px;
    margin:0 auto;
    padding:22px 20px 60px;
  }

  .controls{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:flex-end;
    background:#fff;
    border-radius:18px;
    padding:18px 20px;
    box-shadow:0 10px 26px -18px rgba(66,66,66,.35);
    margin-bottom:20px;
  }
  .ctrl{display:flex;flex-direction:column;gap:6px;}
  .ctrl label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--seal);
  }
  .ctrl input[type=date], .ctrl select{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--elephant);
    padding:11px 14px;
    border-radius:12px;
    border:2px solid var(--light-gray);
    background:#fff;
    outline:none;
    min-width:180px;
  }
  .ctrl input:focus, .ctrl select:focus{border-color:var(--jungle);}
  .ctrl.grow{flex:1;min-width:180px;}
  .ctrl input[type=text]{
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:11px 14px;
    border-radius:12px;
    border:2px solid var(--light-gray);
    width:100%;
    outline:none;
  }
  .ctrl input[type=text]:focus{border-color:var(--jungle);}

  .btn{
    border:none;
    border-radius:12px;
    padding:11px 18px;
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-refresh{background:var(--elephant);color:#fff;}
  .btn-refresh:hover{background:#2f2f2f;}
  .btn-today{background:#fff;color:var(--elephant);border:2px solid var(--light-gray);}
  .btn-today:hover{border-color:var(--honey);}

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:12px;
    margin-bottom:22px;
  }
  .stat{
    background:#fff;
    border-radius:16px;
    padding:16px 18px;
    box-shadow:0 8px 20px -16px rgba(66,66,66,.35);
    border-top:4px solid var(--jungle);
  }
  .stat.candy{border-top-color:var(--candy);}
  .stat.honey{border-top-color:var(--honey);}
  .stat.seal{border-top-color:var(--seal);}
  .stat .num{font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:26px;line-height:1;}
  .stat .lbl{font-size:11.5px;color:var(--seal);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:6px;}

  .list-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:12px;
    flex-wrap:wrap;
    gap:8px;
  }
  .list-head h2{
    font-family:'Montserrat Alternates',sans-serif;
    font-weight:800;
    font-size:18px;
    margin:0;
  }
  .list-head .count{font-size:12.5px;color:var(--seal);font-weight:600;}

  .cards{display:flex;flex-direction:column;gap:10px;}
  .res-card{
    background:#fff;
    border-radius:16px;
    padding:14px 18px;
    display:grid;
    grid-template-columns:70px 1fr auto auto;
    gap:16px;
    align-items:center;
    box-shadow:0 6px 16px -14px rgba(66,66,66,.4);
    border-left:5px solid var(--jungle);
  }
  .res-card.branch-Gómez\ Morin{border-left-color:#00BFA5;}
  .res-card.branch-La\ Aurora{border-left-color:#FF5252;}
  .res-card.branch-Pueblo\ Serena{border-left-color:#FFA726;}

  .res-time{
    font-family:'Montserrat Alternates',sans-serif;
    font-weight:800;
    font-size:16px;
    text-align:center;
  }
  .res-main .res-name{font-weight:700;font-size:15px;}
  .celebration-badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:var(--candy-dark);
    background:#FFE3E3;
    padding:2px 8px;
    border-radius:20px;
    margin-left:6px;
    vertical-align:middle;
  }
  .res-main .res-meta{font-size:12.5px;color:var(--seal);margin-top:2px;}
  .res-branch-tag{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
    padding:5px 10px;
    border-radius:20px;
    background:var(--pastel,#eee);
    white-space:nowrap;
  }
  .res-phone{
    font-size:13.5px;
    font-weight:700;
    color:var(--elephant);
    text-align:right;
    white-space:nowrap;
  }
  .res-phone a{color:inherit;text-decoration:none;}

  .empty{
    background:#fff;
    border-radius:18px;
    padding:44px 20px;
    text-align:center;
    color:var(--seal);
  }
  .empty .ic{font-size:34px;margin-bottom:10px;}
  .empty p{margin:0;font-size:14px;}

  .loading{
    text-align:center;
    padding:40px;
    color:var(--seal);
    font-size:14px;
  }

  @media (max-width:640px){
    .res-card{grid-template-columns:56px 1fr;grid-template-rows:auto auto;}
    .res-phone{text-align:left;grid-column:1/2;}
    .res-branch-tag{justify-self:start;}
  }
</style>
</head>

    <div>
      <div class="brandtitle">Cofki</div>
      <div class="sub">Panel de reservas &middot; sucursales</div>
    </div>
  </div>
</header>

<main>
  <div class="controls">
    <div class="ctrl">
      <label for="filterDate">Fecha</label>
      <input type="date" id="filterDate">
    </div>
    <div class="ctrl">
      <label for="filterBranch">Sucursal</label>
      <select id="filterBranch">
        <option value="">Todas las sucursales</option>
        <option value="Gómez Morin">G&oacute;mez Morin</option>
        <option value="La Aurora">La Aurora</option>
        <option value="Pueblo Serena">Pueblo Serena</option>
      </select>
    </div>
    <div class="ctrl grow">
      <label for="filterSearch">Buscar por nombre o celular</label>
      <input type="text" id="filterSearch" placeholder="Ej. Mariana o 8112345678">
    </div>
    <button class="btn btn-today" id="todayBtn">Hoy</button>
    <button class="btn btn-refresh" id="refreshBtn">Actualizar</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="list-head">
    <h2 id="listTitle">Reservas</h2>
    <span class="count" id="listCount"></span>
  </div>

  <div id="results"></div>
</main>

<script>
(function(){
  // Pega aquí la misma URL /exec de tu Apps Script (ver cofki-reservas-backend.gs)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgeheuXuRf_H1SlN30q7b75AdQNOKrrzVZLNehfk32MUUvypMptLPSeV2beQrlMtra/exec';

  const dateInput = document.getElementById('filterDate');
  const branchSelect = document.getElementById('filterBranch');
  const searchInput = document.getElementById('filterSearch');
  const resultsEl = document.getElementById('results');
  const statsEl = document.getElementById('stats');
  const listTitle = document.getElementById('listTitle');
  const listCount = document.getElementById('listCount');

  const todayIso = new Date().toISOString().slice(0,10);
  dateInput.value = todayIso;

  let allReservations = [];

  const branchTagColors = {
    'Gómez Morin': {bg:'#B3E0DC', fg:'#00695C'},
    'La Aurora': {bg:'#FFCDD2', fg:'#C62828'},
    'Pueblo Serena': {bg:'#FFE0B2', fg:'#E65100'}
  };

  function formatDateLabel(iso){
    if(!iso) return 'todas las fechas';
    const d = new Date(iso + 'T00:00:00');
    const s = d.toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'});
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  async function loadReservations(){
    resultsEl.innerHTML = '<div class="loading">Cargando reservas...</div>';
    try{
      const res = await fetch(SCRIPT_URL + '?action=list');
      const data = await res.json();
      if(!data.success) throw new Error(data.error || 'Error al cargar');
      allReservations = data.data || [];
    }catch(e){
      console.error('Backend error:', e);
      resultsEl.innerHTML = '<div class="empty"><div class="ic">&#9888;&#65039;</div><p>No pudimos cargar las reservas. Intenta actualizar.</p></div>';
      allReservations = [];
      return;
    }
    render();
  }

  function render(){
    const dateVal = dateInput.value;
    const branchVal = branchSelect.value;
    const searchVal = searchInput.value.trim().toLowerCase();

    let filtered = allReservations.filter(r=>{
      if(dateVal && r.date !== dateVal) return false;
      if(branchVal && r.branch !== branchVal) return false;
      if(searchVal){
        const hay = (r.name||'').toLowerCase().includes(searchVal) || (r.phone||'').includes(searchVal);
        if(!hay) return false;
      }
      return true;
    });

    filtered.sort((a,b)=> (a.time||'').localeCompare(b.time||''));

    // stats
    const totalRes = filtered.length;
    const totalAdults = filtered.reduce((s,r)=>s + Number(r.adults||0), 0);
    const totalChildren = filtered.reduce((s,r)=>s + Number(r.children||0), 0);
    const totalPeople = totalAdults + totalChildren;

    statsEl.innerHTML = `
      <div class="stat">
        <div class="num">${totalRes}</div>
        <div class="lbl">Reservas</div>
      </div>
      <div class="stat candy">
        <div class="num">${totalPeople}</div>
        <div class="lbl">Personas en total</div>
      </div>
      <div class="stat honey">
        <div class="num">${totalAdults}</div>
        <div class="lbl">Adultos</div>
      </div>
      <div class="stat seal">
        <div class="num">${totalChildren}</div>
        <div class="lbl">Ni&ntilde;os</div>
      </div>
    `;

    listTitle.textContent = branchVal ? `Reservas · ${branchVal}` : 'Reservas · todas las sucursales';
    listCount.textContent = formatDateLabel(dateVal);

    if(filtered.length === 0){
      resultsEl.innerHTML = `<div class="empty"><div class="ic">&#128203;</div><p>No hay reservas con estos filtros.</p></div>`;
      return;
    }

    resultsEl.innerHTML = `<div class="cards">${filtered.map(cardHtml).join('')}</div>`;
  }

  function cardHtml(r){
    const tag = branchTagColors[r.branch] || {bg:'#eee', fg:'#424242'};
    const timeLabel = r.timeLabel || r.time || '';
    const branchClass = 'branch-' + String(r.branch || '').replace(/\s/g,'\\ ');
    const celebration = celebrationBadge(r.celebration, r.celebrationDetail);
    return `
      <div class="res-card ${branchClass}">
        <div class="res-time">${escapeHtml(timeLabel)}</div>
        <div class="res-main">
          <div class="res-name">${escapeHtml(r.name || 'Sin nombre')}${celebration}</div>
          <div class="res-meta">${Number(r.adults||0)} adulto(s) &middot; ${Number(r.children||0)} ni&ntilde;o(s) &middot; ${escapeHtml(r.date||'')}</div>
        </div>
        <span class="res-branch-tag" style="background:${tag.bg};color:${tag.fg}">${escapeHtml(r.branch||'')}</span>
        <div class="res-phone"><a href="tel:${escapeHtml(r.phone||'')}">${formatPhone(r.phone)}</a></div>
      </div>
    `;
  }

  function celebrationBadge(value, detail){
    if(!value || value === 'Ninguna') return '';
    const icons = { 'Cumpleaños': '🎂', 'Aniversario': '💕', 'Otro': '✨' };
    const icon = icons[value] || '✨';
    const label = value === 'Otro' ? (detail || 'Ocasión especial') : value;
    return ` <span class="celebration-badge">${icon} ${escapeHtml(label)}</span>`;
  }

  function formatPhone(p){
    if(!p || p.length !== 10) return escapeHtml(p||'');
    return `${p.slice(0,2)} ${p.slice(2,6)} ${p.slice(6)}`;
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

  dateInput.addEventListener('change', render);
  branchSelect.addEventListener('change', render);
  searchInput.addEventListener('input', render);
  document.getElementById('refreshBtn').addEventListener('click', loadReservations);
  document.getElementById('todayBtn').addEventListener('click', ()=>{ dateInput.value = todayIso; render(); });

  loadReservations();
})();
</script>
</body>
</html>
