<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Cofki · Mi contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Montserrat+Alternates:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --candy:#FF5252; --jungle:#00BFA5; --elephant:#424242; --seal:#757575; --light-gray:#F4F4F4; --border:#E6E6E6; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; font-family:'Montserrat',sans-serif; background:#FAFAFA; color:var(--elephant); display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:400px; background:#fff; border:1px solid var(--border); border-radius:18px; padding:36px 32px; box-shadow:0 24px 60px -30px rgba(66,66,66,.25); }
  h1{ font-family:'Montserrat Alternates',sans-serif; font-weight:800; font-size:21px; margin:0 0 6px; }
  .sub{ color:var(--seal); font-size:13.5px; margin:0 0 22px; line-height:1.5; }
  label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--seal); margin:16px 0 8px; font-weight:700; }
  input{ width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--border); background:var(--light-gray); font:inherit; font-size:15px; outline:none; }
  input:focus{ border-color:var(--jungle); background:#fff; }
  button{ width:100%; margin-top:22px; padding:13px; border-radius:10px; border:none; background:var(--jungle); color:#fff; font:inherit; font-weight:700; font-size:14.5px; cursor:pointer; }
  button:disabled{ opacity:.6; }
  a{ display:block; text-align:center; margin-top:18px; color:var(--seal); font-size:13px; font-weight:600; text-decoration:none; }
  .msg{ font-size:13px; font-weight:600; margin-top:14px; min-height:16px; text-align:center; }
  .ok{ color:var(--jungle); } .err{ color:var(--candy); }
</style>
</head>
<body>
<form class="card" id="f">
  <h1>Cambiar mi contraseña</h1>
  <p class="sub">Escribe tu contraseña actual y la nueva (mínimo 8 caracteres).</p>
  <label for="actual">Contraseña actual</label>
  <input type="password" id="actual" autocomplete="current-password" required>
  <label for="nueva">Nueva contraseña</label>
  <input type="password" id="nueva" autocomplete="new-password" minlength="8" required>
  <label for="nueva2">Repite la nueva contraseña</label>
  <input type="password" id="nueva2" autocomplete="new-password" minlength="8" required>
  <button type="submit" id="btn">Guardar</button>
  <div class="msg" id="msg"></div>
  <a href="/portal.html">← Volver al portal</a>
</form>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
f.addEventListener('submit', async (e) => {
  e.preventDefault(); msg.textContent = ''; msg.className = 'msg';
  const actual = document.getElementById('actual').value, nueva = document.getElementById('nueva').value;
  if (nueva !== document.getElementById('nueva2').value) { msg.textContent = 'Las contraseñas nuevas no coinciden.'; msg.className = 'msg err'; return; }
  btn.disabled = true;
  try {
    const res = await fetch('/api/account-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ actual, nueva }) });
    if (res.status === 401) { window.location.href = '/index.html'; return; }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'No se pudo cambiar');
    msg.textContent = 'Contraseña actualizada.'; msg.className = 'msg ok'; f.reset();
  } catch (err) { msg.textContent = err.message; msg.className = 'msg err'; }
  btn.disabled = false;
});
</script>
</body>
</html>
